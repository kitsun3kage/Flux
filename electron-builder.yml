appId: com.kitsun3kage.flux
productName: Flux
copyright: Copyright © 2026 Kitsun3 Kage

directories:
  output: dist
  buildResources: build

files:
  - "**/*"
  - "!dist/**"
  - "!**/.DS_Store"
  - "!node_modules/**/{test,__tests__,tests,powered-test,example,examples}"
  - "!*.md"
  - "!*.map"
  - "!*.log"

asar: true

# ==================================================
# MACOS
# ==================================================
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - universal
    - target: zip
      arch:
        - universal
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  darkModeSupport: true
  extendInfo:
    NSHumanReadableCopyright: "Copyright © 2026 Kitsun3 Kage"
    CFBundleURLTypes:
      - CFBundleURLName: "Web Browser"
        CFBundleURLSchemes:
          - http
          - https
      - CFBundleURLName: "Flux Protocol"
        CFBundleURLSchemes:
          - flux

dmg:
  title: Flux
  icon: build/icon.icns
  contents:
    - x: 140
      y: 180
      type: file
    - x: 400
      y: 180
      type: link
      path: /Applications

# ==================================================
# WINDOWS – minimalna konfiguracja
# ==================================================
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico

# ==================================================
# LINUX – minimalna konfiguracja
# ==================================================
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  icon: build/icon.png
  category: Network
  synopsis: "Szybka i lekka przeglądarka"
  description: |
    Flux to szybka, lekka i prywatna przeglądarka internetowa.

    Cechy:
    - Wbudowany adblock i anti-tracking
    - Ochrona prywatności (DNT/GPC, anti-fingerprinting)
    - 7 palet kolorów
    - Motyw jasny i ciemny
    - Wewnętrzne strony flux://
    - Tryb prywatny
    - Menedżer zakładek, historii, haseł i pobierania
  maintainer: Kitsun3 Kage

# ==================================================
# PUBLISH
# ==================================================
publish:
  provider: github
  owner: kitsun3kage
  repo: Flux
  releaseType: release
