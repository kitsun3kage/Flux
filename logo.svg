<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="flux-clip">
      <circle cx="128" cy="128" r="112" />
    </clipPath>
    
    <linearGradient id="flux-base" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1A2233"/>
      <stop offset="1" stop-color="#0A0E1A"/>
    </linearGradient>

    <linearGradient id="flux-brand" x1="0" y1="40" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop id="brand-1" offset="0%" stop-color="#4A9EFF"/>
      <stop id="brand-2" offset="50%" stop-color="#1E6FDC"/>
      <stop id="brand-3" offset="100%" stop-color="#0A2A6B"/>
    </linearGradient>
    
    <linearGradient id="flux-glass" x1="128" y1="16" x2="128" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8EEF9" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#E8EEF9" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <circle cx="128" cy="134" r="112" fill="#000000" fill-opacity="0.3" filter="blur(8px)" />
  <circle cx="128" cy="128" r="112" fill="url(#flux-base)" />

  <g clip-path="url(#flux-clip)">
    <path d="M-20,140 Q 60,70 140,150 T 300,120 L 300,260 L -20,260 Z" fill="url(#flux-brand)" opacity="0.6"/>
    <path d="M-20,180 Q 80,100 160,190 T 300,150 L 300,260 L -20,260 Z" fill="url(#flux-brand)"/>
    <path d="M-20,50 C 90,-30 160,160 280,40 L 280,-20 L -20,-20 Z" fill="url(#flux-brand)" opacity="0.15"/>
    <path d="M104,80 L164,80 L164,104 L128,104 L128,124 L154,124 L154,148 L128,148 L128,185 Q116,180 104,175 Z" fill="#E8EEF9" opacity="0.95" />
  </g>

  <circle cx="128" cy="128" r="111" fill="none" stroke="url(#flux-glass)" stroke-width="2"/>
