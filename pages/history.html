<!DOCTYPE html>
<html lang="pl" data-palette="neutral" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historia – Flux</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, :root, [data-palette="neutral"] {
      --accent-bright: #8AB4F8; --accent-main: #669DF6; --accent-deep: #1A73E8; --accent-rgb: 138, 180, 248;
    }
    [data-palette="emerald"] { --accent-bright: #4ADE80; --accent-main: #16A34A; --accent-deep: #064E3B; --accent-rgb: 22, 163, 74; }
    [data-palette="violet"]  { --accent-bright: #C084FC; --accent-main: #9333EA; --accent-deep: #4C1D95; --accent-rgb: 147, 51, 234; }
    [data-palette="rose"]    { --accent-bright: #FB7185; --accent-main: #E11D48; --accent-deep: #881337; --accent-rgb: 225, 29, 72; }
    [data-palette="amber"]   { --accent-bright: #FBBF24; --accent-main: #D97706; --accent-deep: #78350F; --accent-rgb: 217, 119, 6; }
    [data-palette="cyan"]    { --accent-bright: #22D3EE; --accent-main: #0891B2; --accent-deep: #164E63; --accent-rgb: 8, 145, 178; }

    :root, [data-theme="dark"] {
      --bg: #0B0F1A; --bg-card: #1A2236; --bg-input: #1A2236;
      --text-main: #E8EEF9; --text-dim: #7A87A3; --text-faint: #4A5670;
      --border: #1E2740; --border-soft: #18203A;
      --red: #FF6B7A;
    }
    [data-theme="light"] {
      --bg: #F7F9FC; --bg-card: #FFFFFF; --bg-input: #FFFFFF;
      --text-main: #0A0E1A; --text-dim: #5A6780; --text-faint: #8A94A8;
      --border: #DDE4EE; --border-soft: #E8EDF5;
      --red: #D6334A;
    }

    body {
      font-family: -apple-system, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
      background: var(--bg); color: var(--text-main);
      min-height: 100vh; -webkit-font-smoothing: antialiased;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .container { max-width: 900px; margin: 0 auto; padding: 48px 32px; }

    .header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 32px; gap: 16px; flex-wrap: wrap;
    }

    .title {
      font-size: 32px; font-weight: 800; letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--accent-bright), var(--accent-main));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .btn {
      padding: 10px 18px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--bg-input);
      color: var(--text-main);
      font-size: 13px; font-family: inherit; font-weight: 600;
      cursor: pointer; transition: all 0.15s ease;
    }
    .btn:hover {
      background: rgba(var(--accent-rgb), 0.12);
      border-color: var(--accent-main);
      color: var(--accent-bright);
    }
    .btn-danger { color: var(--red); border-color: rgba(255, 107, 122, 0.3); }
    .btn-danger:hover { background: rgba(255, 107, 122, 0.15); border-color: var(--red); color: var(--red); }

    .search-bar {
      display: flex; align-items: center; gap: 10px;
      background: var(--bg-input); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 18px; margin-bottom: 24px;
      transition: all 0.15s ease;
    }
    .search-bar:focus-within {
      border-color: var(--accent-main);
      box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.2);
    }
    .search-bar svg { color: var(--text-dim); flex-shrink: 0; }
    .search-bar input {
      flex: 1; border: none; background: transparent;
      color: var(--text-main); font-size: 14px; font-family: inherit; outline: none;
    }

    .day-group { margin-bottom: 28px; }
    .day-header {
      font-size: 12px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1px; color: var(--accent-bright);
      margin-bottom: 10px; padding-left: 4px; opacity: 0.9;
    }

    .item {
      display: flex; align-items: center; gap: 14px;
      padding: 12px 16px; border-radius: 12px;
      cursor: pointer; transition: background 0.12s ease;
      text-decoration: none; color: inherit;
    }
    .item:hover { background: rgba(var(--accent-rgb), 0.1); }

    .item-favicon {
      width: 20px; height: 20px; border-radius: 4px;
      background: var(--bg-input);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; flex-shrink: 0; overflow: hidden;
    }
    .item-favicon img { width: 100%; height: 100%; object-fit: contain; }

    .item-content { flex: 1; min-width: 0; }
    .item-title {
      font-size: 13.5px; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .item-url {
      font-size: 11.5px; color: var(--text-dim);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-top: 2px;
    }
    .item-time {
      font-size: 11.5px; color: var(--text-faint);
      font-variant-numeric: tabular-nums; flex-shrink: 0;
    }
    .item-remove {
      background: none; border: none; color: var(--text-faint);
      cursor: pointer; font-size: 18px; line-height: 1;
      padding: 4px 8px; border-radius: 6px;
      opacity: 0; transition: all 0.15s ease; flex-shrink: 0;
    }
    .item:hover .item-remove { opacity: 1; }
    .item-remove:hover { background: rgba(255, 107, 122, 0.15); color: var(--red); }

    .empty {
      text-align: center; padding: 80px 20px; color: var(--text-dim);
    }
    .empty-icon { font-size: 64px; margin-bottom: 16px; opacity: 0.4; }
    .empty-title { font-size: 18px; font-weight: 600; color: var(--text-main); margin-bottom: 6px; }
    .empty-desc { font-size: 13px; }

    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, rgba(var(--accent-rgb), 0.5), var(--accent-main));
      border-radius: 5px; border: 2px solid transparent; background-clip: content-box;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1 class="title">Historia</h1>
      <div>
        <button class="btn btn-danger" id="clear-history">Wyczyść historię</button>
      </div>
    </div>

    <div class="search-bar">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" id="search" placeholder="Szukaj w historii..." autofocus />
    </div>

    <div id="history-list"></div>
  </div>

  <script>
    let settingsCache = {};

    async function loadAllSettings() {
      if (window.flux?.settings) {
        try { settingsCache = await window.flux.settings.getAll(); } catch {}
      }
    }

    function getSetting(key, fallback) {
      return key in settingsCache ? settingsCache[key] : fallback;
    }

    function applyTheme(theme) {
      let resolved = theme;
      if (theme === 'system') {
        resolved = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.setAttribute('data-theme', resolved);
    }

    function applyPalette(paletteId) {
      if (!paletteId) paletteId = 'default';
      document.documentElement.setAttribute('data-palette', paletteId);
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    function getFavicon(pageUrl) {
      try {
        const u = new URL(pageUrl);
        return `https://www.google.com/s2/favicons?domain=${u.hostname}&sz=32`;
      } catch { return null; }
    }

    function loadHistory() {
      try { return JSON.parse(localStorage.getItem('flux-history') || '[]'); }
      catch { return []; }
    }

    function saveHistory(history) {
      localStorage.setItem('flux-history', JSON.stringify(history));
    }

    function groupByDay(history) {
      const groups = {};
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const yesterday = new Date(today); yesterday.setDate(today.getDate() - 1);

      history.slice().reverse().forEach(item => {
        const date = new Date(item.ts);
        date.setHours(0, 0, 0, 0);
        let label;
        if (date.getTime() === today.getTime()) label = 'Dzisiaj';
        else if (date.getTime() === yesterday.getTime()) label = 'Wczoraj';
        else label = date.toLocaleDateString('pl-PL', { day: 'numeric', month: 'long', year: 'numeric' });

        if (!groups[label]) groups[label] = [];
        groups[label].push(item);
      });

      return groups;
    }

    function formatTime(ts) {
      const date = new Date(ts);
      return date.toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit' });
    }

    let currentFilter = '';

    function render() {
      const list = document.getElementById('history-list');
      let history = loadHistory();

      if (currentFilter) {
        const f = currentFilter.toLowerCase();
        history = history.filter(item =>
          (item.title || '').toLowerCase().includes(f) ||
          (item.url || '').toLowerCase().includes(f)
        );
      }

      if (history.length === 0) {
        list.innerHTML = `
          <div class="empty">
            <div class="empty-icon">📭</div>
            <div class="empty-title">Brak historii</div>
            <div class="empty-desc">${currentFilter ? 'Nie znaleziono wyników' : 'Odwiedź jakieś strony, aby zobaczyć je tutaj'}</div>
          </div>
        `;
        return;
      }

      const groups = groupByDay(history);
      list.innerHTML = '';

      Object.entries(groups).forEach(([day, items]) => {
        const group = document.createElement('div');
        group.className = 'day-group';
        group.innerHTML = `<div class="day-header">${day}</div>`;

        items.forEach(item => {
          const el = document.createElement('a');
          el.className = 'item';
          el.href = '#';
          const fav = getFavicon(item.url);
          el.innerHTML = `
            <span class="item-favicon">
              ${fav ? `<img src="${fav}" onerror="this.replaceWith('🌐')"/>` : '🌐'}
            </span>
            <div class="item-content">
              <div class="item-title">${escapeHtml(item.title)}</div>
              <div class="item-url">${escapeHtml(item.url)}</div>
            </div>
            <span class="item-time">${formatTime(item.ts)}</span>
            <button class="item-remove" title="Usuń">×</button>
          `;
          el.addEventListener('click', (e) => {
            if (e.target.classList.contains('item-remove')) return;
            e.preventDefault();
            window.location.href = item.url;
          });
          el.querySelector('.item-remove').addEventListener('click', (e) => {
            e.stopPropagation();
            removeItem(item.ts);
          });
          group.appendChild(el);
        });

        list.appendChild(group);
      });
    }

    function removeItem(ts) {
      let history = loadHistory();
      history = history.filter(item => item.ts !== ts);
      saveHistory(history);
      render();
    }

    document.getElementById('search').addEventListener('input', (e) => {
      currentFilter = e.target.value;
      render();
    });

    document.getElementById('clear-history')?.addEventListener('click', () => {
      if (!confirm('Wyczyścić całą historię?')) return;
      localStorage.setItem('flux-history', '[]');
      render();
    });

    if (window.flux?.settings) {
      window.flux.settings.onChange(({ key, value }) => {
        settingsCache[key] = value;
        if (key === 'theme') applyTheme(value);
        if (key === 'palette') applyPalette(value);
      });
    }

    window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => {
      if (getSetting('theme', 'dark') === 'system') applyTheme('system');
    });

    (async () => {
      await loadAllSettings();
      applyTheme(getSetting('theme', 'dark'));
      applyPalette(getSetting('palette', 'default'));
      render();
    })();
  </script>
</body>
</html>
