<!DOCTYPE html>
<html lang="pl" data-palette="neutral" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zablokowane – Flux</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, :root, [data-palette="neutral"] {
      --accent-bright: #8AB4F8; --accent-main: #669DF6; --accent-deep: #1A73E8; --accent-rgb: 138, 180, 248;
    }
    [data-palette="default"] { --accent-bright: #5AA7FF; --accent-main: #2E7DE0; --accent-deep: #0A2A6B; --accent-rgb: 46, 125, 224; }
    [data-palette="emerald"] { --accent-bright: #4ADE80; --accent-main: #16A34A; --accent-deep: #064E3B; --accent-rgb: 22, 163, 74; }
    [data-palette="violet"] { --accent-bright: #C084FC; --accent-main: #9333EA; --accent-deep: #4C1D95; --accent-rgb: 147, 51, 234; }
    [data-palette="rose"] { --accent-bright: #FB7185; --accent-main: #E11D48; --accent-deep: #881337; --accent-rgb: 225, 29, 72; }
    [data-palette="amber"] { --accent-bright: #FBBF24; --accent-main: #D97706; --accent-deep: #78350F; --accent-rgb: 217, 119, 6; }
    [data-palette="cyan"] { --accent-bright: #22D3EE; --accent-main: #0891B2; --accent-deep: #164E63; --accent-rgb: 8, 145, 178; }

    :root, [data-theme="dark"] {
      --bg: #1F1F1F;
      --bg-card: #2A2A2A;
      --text-main: #E8EAED;
      --text-dim: #9AA0A6;
      --text-faint: #5F6368;
      --border: #3C4043;
      --purple: #A78BFA;
      --purple-deep: #7C3AED;
      --orange: #FDD663;
    }
    [data-theme="light"] {
      --bg: #F1F3F4;
      --bg-card: #FFFFFF;
      --text-main: #202124;
      --text-dim: #5F6368;
      --text-faint: #80868B;
      --border: #DADCE0;
      --purple: #7C3AED;
      --purple-deep: #4C1D95;
      --orange: #EA8600;
    }

    body {
      font-family: -apple-system, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      -webkit-font-smoothing: antialiased;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .box {
      max-width: 520px;
      width: 100%;
      text-align: center;
    }

    .icon {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #A78BFA, #7C3AED);
      box-shadow: 0 12px 40px rgba(147, 51, 234, 0.35);
      color: white;
      flex-shrink: 0;
    }

    h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--purple);
      margin-bottom: 16px;
    }

    p {
      font-size: 14.5px;
      color: var(--text-dim);
      line-height: 1.6;
      margin-bottom: 12px;
    }

    p strong {
      color: var(--text-main);
      font-weight: 700;
    }

    .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 32px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 22px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-main);
      font-size: 13.5px;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }

    .btn:hover {
      background: rgba(127, 127, 127, 0.1);
    }

    .btn-primary {
      background: linear-gradient(135deg, #A78BFA, #7C3AED);
      border-color: transparent;
      color: #FFFFFF;
      box-shadow: 0 4px 14px rgba(147, 51, 234, 0.4);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #C084FC, #9333EA);
      box-shadow: 0 6px 20px rgba(147, 51, 234, 0.55);
      color: #FFFFFF;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">
      <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a10 10 0 1 0 10 10"/>
        <path d="M2 12a10 10 0 0 0 10 10"/>
        <path d="M9 9h.01M15 9h.01"/>
        <path d="M8 15c1.5 1.5 6.5 1.5 8 0"/>
      </svg>
    </div>

    <h1 id="title">Musisz przejść do zwykłej przeglądarki</h1>
    <p id="desc">
      Ta strona nie jest dostępna w trybie prywatnym.<br>
      Otwórz ją w zwykłym oknie Flux.
    </p>

    <div class="actions">
      <a class="btn btn-primary" href="flux://home">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 10.5L12 3l9 7.5"/>
          <path d="M5 9.5V21h14V9.5"/>
        </svg>
        Strona startowa
      </a>
    </div>
  </div>

  <script>
    // ⬇️ Rozróżnij komunikat w zależności od tego co próbowano otworzyć
    // Parametr `page` jest przekazywany w URL jako query string
    // Electron z protokołem `flux://` nie zawsze przekazuje query, więc sprawdzamy też meta tag

    let blockedPage = '';

    // 1) Spróbuj z meta tagu (wstrzykniętego przez main.js)
    const metaParams = document.querySelector('meta[name="flux-params"]');
    if (metaParams) {
      const params = new URLSearchParams(metaParams.getAttribute('content'));
      blockedPage = params.get('page') || '';
    }

    // 2) Fallback: spróbuj z URL
    if (!blockedPage) {
      try {
        const urlParams = new URLSearchParams(window.location.search);
        blockedPage = urlParams.get('page') || '';
      } catch {}
    }

    // 3) Fallback: spróbuj z hasha
    if (!blockedPage && window.location.hash) {
      const hash = window.location.hash.replace('#', '');
      if (hash.includes('page=')) {
        blockedPage = hash.split('page=')[1].split('&')[0];
      }
    }

    const titleEl = document.getElementById('title');
    const descEl = document.getElementById('desc');

    if (blockedPage === 'privacy') {
      // Próba wejścia na flux://privacy w ZWYKŁYM oknie
      titleEl.textContent = 'Musisz otworzyć nowe okno prywatne';
      descEl.innerHTML = `
        Ta strona jest dostępna tylko w trybie prywatnym.<br>
        Aby otworzyć nowe okno prywatne, naciśnij <strong>⌘⇧N</strong> (Mac) lub <strong>Ctrl+Shift+N</strong> (Windows/Linux).
      `;
    } else if (blockedPage === 'settings' || blockedPage === 'history') {
      // Próba wejścia na flux://settings albo flux://history w PRYWATNYM oknie
      titleEl.textContent = 'Musisz przejść do zwykłej przeglądarki';
      descEl.innerHTML = `
        Ta strona nie jest dostępna w trybie prywatnym.<br>
        Otwórz nowe <strong>zwykłe okno</strong>, aby uzyskać dostęp do ustawień lub historii.
      `;
    } else {
      // Domyślnie
      titleEl.textContent = 'Musisz przejść do zwykłej przeglądarki';
      descEl.innerHTML = `Ta strona nie jest dostępna w trybie prywatnym.`;
    }

    // ⬇️ Dziedziczenie motywu i palety z ustawień
    if (window.flux?.settings) {
      (async () => {
        try {
          const settings = await window.flux.settings.getAll();

          // Paleta
          if (settings.palette) {
            document.documentElement.setAttribute('data-palette', settings.palette);
          }

          // Motyw – w trybie prywatnym (page=settings/history) wymuś ciemny
          if (blockedPage === 'settings' || blockedPage === 'history') {
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            let theme = settings.theme || 'dark';
            if (theme === 'system') {
              theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
            }
            document.documentElement.setAttribute('data-theme', theme);
          }
        } catch {}
      })();
    }

    // ⬇️ Nasłuchuj zmian (jeśli użytkownik zmieni motyw w innym oknie)
    if (window.flux?.settings) {
      window.flux.settings.onChange(({ key, value }) => {
        if (key === 'palette') {
          document.documentElement.setAttribute('data-palette', value);
        }
        if (key === 'theme') {
          // W trybie prywatnym nie zmieniaj
          if (blockedPage === 'settings' || blockedPage === 'history') return;
          let resolved = value;
          if (value === 'system') {
            resolved = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', resolved);
        }
      });
    }
  </script>
</body>
</html>
